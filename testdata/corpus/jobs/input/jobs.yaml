# Running Job with a manual selector: the selector is the user's and is kept.
# It sets ttlSecondsAfterFinished, so it is not reported as JOBS_WITHOUT_TTL.
apiVersion: batch/v1
kind: Job
metadata: {name: reindex, namespace: batch, uid: c0000000-0000-0000-0000-000000000030}
spec:
  manualSelector: true
  ttlSecondsAfterFinished: 3600
  selector:
    matchLabels: {app: reindex}
  template:
    metadata:
      labels: {app: reindex}
    spec:
      restartPolicy: Never
      containers: [{name: reindex, image: ghcr.io/example/reindex:1}]
status: {active: 1}
---
