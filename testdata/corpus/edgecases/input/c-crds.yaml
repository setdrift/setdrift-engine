# A CRD and a resource of its kind: the CRD goes to crds/, first in the root
# kustomization.yaml, and the README gives the two-step kubectl order.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata: {name: widgets.example.com, uid: e0000000-0000-0000-0000-000000000090}
spec:
  group: example.com
  names: {kind: Widget, plural: widgets, singular: widget, listKind: WidgetList}
  scope: Namespaced
  versions:
  - name: v1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        x-kubernetes-preserve-unknown-fields: true
---
apiVersion: example.com/v1
kind: Widget
metadata: {name: blue, namespace: shop, uid: e0000000-0000-0000-0000-000000000091}
spec: {color: blue}
