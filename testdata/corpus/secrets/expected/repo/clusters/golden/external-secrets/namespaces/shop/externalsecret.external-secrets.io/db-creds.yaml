apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: db-creds
  namespace: shop
spec:
  data:
  - remoteRef:
      key: golden/shop/db-creds
      property: password
    secretKey: password
  - remoteRef:
      key: golden/shop/db-creds
      property: username
    secretKey: username
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: secret-store
  target:
    name: db-creds
