apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: repo-platform
  namespace: argocd
spec:
  data:
  - remoteRef:
      key: golden/argocd/repo-platform
      property: password
    secretKey: password
  - remoteRef:
      key: golden/argocd/repo-platform
      property: url
    secretKey: url
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: secret-store
  target:
    name: repo-platform
    template:
      metadata:
        annotations:
          team: platform
        labels:
          argocd.argoproj.io/secret-type: repository
