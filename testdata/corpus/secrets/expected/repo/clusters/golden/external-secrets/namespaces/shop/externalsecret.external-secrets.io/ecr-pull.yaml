apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ecr-pull
  namespace: shop
spec:
  data:
  - remoteRef:
      key: golden/shop/ecr-pull
      property: .dockerconfigjson
    secretKey: .dockerconfigjson
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: secret-store
  target:
    name: ecr-pull
    template:
      type: kubernetes.io/dockerconfigjson
