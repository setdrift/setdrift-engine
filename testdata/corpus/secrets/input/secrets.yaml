# Secrets and secret values elsewhere. Every value is redacted; Secrets get
# an ExternalSecret under external-secrets/, not applied by default.
apiVersion: v1
kind: Namespace
metadata: {name: shop, uid: b1000000-0000-0000-0000-000000000001}
---
# Opaque Secret: an ExternalSecret reading shop's remote secret
# golden/shop/db-creds, properties password and username.
apiVersion: v1
kind: Secret
type: Opaque
metadata: {name: db-creds, namespace: shop, uid: b1000000-0000-0000-0000-000000000002}
data: {username: YXBw, password: aHVudGVyMg==}
---
# Image pull secret: the ExternalSecret keeps the type; the placeholder keeps
# the registry name.
apiVersion: v1
kind: Secret
type: kubernetes.io/dockerconfigjson
metadata: {name: ecr-pull, namespace: shop, uid: b1000000-0000-0000-0000-000000000003}
data:
  .dockerconfigjson: eyJhdXRocyI6eyIxMTExMjIyMjMzMzMuZGtyLmVjci51cy1lYXN0LTEuYW1hem9uYXdzLmNvbSI6eyJ1c2VybmFtZSI6IkFXUyIsInBhc3N3b3JkIjoiaHVudGVyMiJ9fX0=
---
# Token data and the account UID are the token controller's: removed, and the
# Secret stays in the applied set with no ExternalSecret.
apiVersion: v1
kind: Secret
type: kubernetes.io/service-account-token
metadata:
  name: ci-token
  namespace: shop
  uid: b1000000-0000-0000-0000-000000000004
  annotations: {kubernetes.io/service-account.name: ci, kubernetes.io/service-account.uid: 6a1f0c2e-0000-0000-0000-000000000001}
data: {token: ZXlKaGJHY2lPaUpTVXpJMU5pSjk=, ca.crt: TFMwdA==, namespace: c2hvcA==}
---
# A literal password in an env var: redacted, and the Deployment is written
# to redacted/ with SECRET_IN_MANIFEST. LOG_LEVEL stays.
apiVersion: apps/v1
kind: Deployment
metadata: {name: api, namespace: shop, uid: b1000000-0000-0000-0000-000000000005}
spec:
  selector:
    matchLabels: {app: api}
  template:
    metadata:
      labels: {app: api}
    spec:
      containers:
      - name: api
        image: ghcr.io/example/api:2
        env:
        - {name: DB_PASSWORD, value: hunter2hunter2}
        - {name: LOG_LEVEL, value: info}
        - name: DB_USER
          valueFrom:
            secretKeyRef: {name: db-creds, key: username}
---
# A Deployment that references its Secret properly: applied as usual.
apiVersion: apps/v1
kind: Deployment
metadata: {name: worker, namespace: shop, uid: b1000000-0000-0000-0000-000000000006}
spec:
  selector:
    matchLabels: {app: worker}
  template:
    metadata:
      labels: {app: worker}
    spec:
      containers:
      - name: worker
        image: ghcr.io/example/worker:2
        env:
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef: {name: db-creds, key: password}
---
# A config file with a password in a ConfigMap: redacted.
apiVersion: v1
kind: ConfigMap
metadata: {name: app-config, namespace: shop, uid: b1000000-0000-0000-0000-000000000007}
data:
  application.properties: |
    db.url=jdbc:postgresql://db:5432/app
    db.password=hunter2hunter2
---
# Argo CD finds its repository credentials by label: the ExternalSecret's
# template carries the Secret's labels and annotations.
apiVersion: v1
kind: Secret
metadata:
  name: repo-platform
  namespace: argocd
  uid: c0000000-0000-0000-0000-0000000000a0
  labels: {argocd.argoproj.io/secret-type: repository}
  annotations: {team: platform}
type: Opaque
stringData:
  url: https://github.com/example/platform.git
  password: ghp_notarealtokennotarealtokennotarealtok
