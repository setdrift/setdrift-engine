# Claims a StatefulSet created from its volumeClaimTemplates (Retain policy,
# so no ownerReference): skipped, the StatefulSet creates them again.
# data-db-x and a claim for a template the StatefulSet doesn't have are
# configuration.
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: db, namespace: shop, uid: a1000000-0000-0000-0000-000000000080}
spec:
  replicas: 2
  selector:
    matchLabels: {app: db}
  serviceName: db
  template:
    metadata:
      labels: {app: db}
    spec:
      containers: [{name: postgres, image: "postgres:16"}]
  volumeClaimTemplates:
  - metadata: {name: data}
    spec:
      accessModes: [ReadWriteOnce]
      resources:
        requests: {storage: 10Gi}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: data-db-0, namespace: shop, uid: a1000000-0000-0000-0000-000000000081, labels: {app: db}}
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: {storage: 10Gi}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: data-db-1, namespace: shop, uid: a1000000-0000-0000-0000-000000000082, labels: {app: db}}
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: {storage: 10Gi}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: data-db-x, namespace: shop, uid: a1000000-0000-0000-0000-000000000083}
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: {storage: 1Gi}
---
apiVersion: v1
