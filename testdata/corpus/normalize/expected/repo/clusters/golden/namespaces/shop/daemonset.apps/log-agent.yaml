apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: log-agent
  namespace: shop
spec:
  selector:
    matchLabels:
      app: log-agent
  template:
    metadata:
      labels:
        app: log-agent
    spec:
      containers:
      - image: fluent/fluent-bit:latest
        name: agent
        volumeMounts:
        - mountPath: /var/log
          name: logs
      volumes:
      - hostPath:
          path: /var/log
        name: logs
      - configMap:
          name: fluent-bit
        name: config
