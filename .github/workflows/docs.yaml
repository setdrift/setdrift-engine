# A change to docs/ or README.md on main (the site builds its docs home and
# its Install and Usage pages from the README) rebuilds preview.setdrift.io,
# where main's docs are the latest, and setdrift.io (which shows released
# docs only, or main before the first release). The site's repository
# (setdrift/setdrift.io) copies these pages at every build. It needs the secret SITE_DISPATCH_TOKEN
# (Contents read and write on that repository); without it, this does
# nothing. release.yaml sends engine-release after each release.
name: docs

on:
  push:
    # a release branch (release-v0.2) holds the docs fixes to a released version
    branches: [main, "release-v*"]
    paths: ["docs/**", "README.md"]

permissions:
  contents: read

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - name: Rebuild setdrift.io
        env:
          GH_TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "SITE_DISPATCH_TOKEN is not set: setdrift.io rebuilds on its own next deploy"
            exit 0
          fi
          gh api repos/setdrift/setdrift.io/dispatches -f event_type=engine-docs

