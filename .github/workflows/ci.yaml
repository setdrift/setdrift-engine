# CI for every pull request and every push to main: lint, check that
# generated files are current, test, and build for each release platform.
# Each step runs a make target, so a failure can be reproduced locally.
name: ci

on:
  push:
    branches: [main]
  pull_request:

# Read-only token: CI only reads the repo. A public repo runs workflows from
# forked pull requests, so the token gets no more than it needs.
permissions:
  contents: read

# A new push to a pull request cancels the run still going for its previous
# push. Each push to main gets its own group, so every commit on main is tested.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to a commit, not a tag: a tag can be moved to other
      # code, a commit can't. Dependabot keeps the pins current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # The Go version in go.mod, so CI and local builds match.
          go-version-file: go.mod
      - run: make lint
      # The public repo must never depend on the private one. Fails on any
      # reference to the private module path (setdrift.io/setdrift).
      - name: No references to the private module
        run: |
          if git grep -n 'setdrift\.io/setdrift\([/"]\|$\)'; then
            echo "error: the public repo references the private module" >&2
            exit 1
          fi
      # Generated code and THIRD_PARTY_NOTICES are committed. Regenerate both
      # and fail if anything changed or a new file appeared (git status sees
      # new files; git diff would not).
      - name: Generated files are up to date
        run: |
          make generate notices
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            git diff
            echo "error: run make generate notices and commit the result" >&2
            exit 1
          fi
      # -race also catches data races in the concurrent code (collect, verify).
      - name: Test
        run: go test -race ./...
      # Cross-compile for every release platform, so an OS-specific build
      # break shows up here rather than at release time. Keep the list in step
      # with scripts/third-party-notices.sh.
      - name: Build
        run: |
          make build
          for p in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            GOOS=${p%/*} GOARCH=${p#*/} CGO_ENABLED=0 go build -o /dev/null ./cmd/setdrift
          done
      # The release binaries stay under the size budget (Makefile MAX_SIZE_MIB).
      - name: Binary size
        run: make size

  # The release archives, built as a release would build them but published
  # nowhere, for the install jobs below.
  release-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: "~> v2"
          args: release --snapshot --clean
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
          retention-days: 3

  # The install commands in README.md, on each OS and CPU a release supports:
  # each installer fetches those archives from a local server (as from a
  # release), checks the checksum, installs, and runs setdrift.
  install-unix:
    needs: release-build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: install.sh
        run: |
          (cd dist && python3 -m http.server 8765 >/dev/null 2>&1 &)
          # Wait for the server: a slow runner takes more than a few seconds.
          for i in $(seq 60); do curl -fsI http://127.0.0.1:8765/checksums.txt >/dev/null 2>&1 && break; sleep 1; done
          version=$(ls dist/*_linux_amd64.tar.gz | sed 's#.*/setdrift_##; s#_linux_amd64.tar.gz##')
          SETDRIFT_VERSION=$version SETDRIFT_DOWNLOAD_URL=http://127.0.0.1:8765 sh scripts/install.sh
          bin=$(command -v setdrift || echo "$HOME/.local/bin/setdrift")
          "$bin" version | grep -F "v$version"
          "$bin" export --help >/dev/null

  install-windows:
    needs: release-build
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm]
        # PowerShell 7, and the Windows PowerShell 5.1 that every Windows has.
        shell: [pwsh, powershell]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: install.ps1
        run: |
          Start-Process python -ArgumentList '-m', 'http.server', '8765' -WorkingDirectory dist -WindowStyle Hidden
          # Wait for the server: a slow runner takes more than a few seconds.
          foreach ($i in 1..60) {
            try { Invoke-WebRequest -UseBasicParsing -Method Head http://127.0.0.1:8765/checksums.txt | Out-Null; break } catch { Start-Sleep -Seconds 1 }
          }
          $version = (Get-ChildItem dist/*_windows_amd64.zip).Name -replace '^setdrift_(.*)_windows_amd64\.zip$', '$1'
          $env:SETDRIFT_VERSION = $version
          $env:SETDRIFT_DOWNLOAD_URL = 'http://127.0.0.1:8765'
          Get-Content -Raw scripts/install.ps1 | Invoke-Expression
          $exe = Join-Path $env:LOCALAPPDATA 'Programs\setdrift\setdrift.exe'
          $out = & $exe version
          $out
          if ($out -notlike "*v$version*") { throw "setdrift version printed $out" }
          # On the PATH of this session, and of new terminals.
          (Get-Command setdrift).Source
          if (-not ([Environment]::GetEnvironmentVariable('Path', 'User') -split ';' -contains (Split-Path $exe))) { throw 'not on the user PATH' }

  # Not here yet: end-to-end export, restore and verify against EKS for the
  # three Kubernetes versions EKS supports (n-2). The harness is in test/e2e;
  # running it from CI needs AWS credentials through OIDC (no stored keys) and
  # a way to keep forked pull requests from starting billed clusters.

