# CI for every pull request and every push to main: lint, check that
# generated files are current, test, build the release archives for each
# platform, and install them on each OS. Each step runs a make target or the
# release tool, so a failure can be reproduced locally.
# release.yaml calls it too, so nothing is published unless all of it passes.
#
# Speed: the goal is under 3 minutes for a push. Two things keep it there.
# Each platform is compiled once, by GoReleaser in release-build (make size
# measures those binaries). And the Go build cache is kept between runs, so
# only what changed is compiled again: runs on main save it, every other run
# (pull requests, Dependabot, the release tag) restores main's copy and never
# writes one. The release job in release.yaml builds what it publishes
# without any cache.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  # dependabot-notices.yaml starts it on a Dependabot branch after committing
  # the notices, as a pull request would; any other start runs it the same way.
  workflow_dispatch:

# Read-only token: CI only reads the repo. A public repo runs workflows from
# forked pull requests, so the token gets no more than it needs.
permissions:
  contents: read

# A new push to a pull request cancels the run still going for its previous
# push. Each push to main gets its own group, so every commit on main is tested.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

env:
  # Only runs on main write caches; see the note at the top.
  SAVE_CACHE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

jobs:
  # Whether the change can affect the release archives. A change to docs and
  # Markdown files only still runs lint and tests (tests read docs/), but skips
  # the release build and install jobs. Those then show as skipped, which
  # branch protection accepts. A tag (release.yaml) always builds.
  changes:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.diff.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # No file list (a tag, or a commit git can't find) means build.
          files=
          if [ "$EVENT" = pull_request ]; then
            files=$(git diff --name-only "$BASE...$HEAD" || true)
          elif [ "$REF" = refs/heads/main ]; then
            files=$(git diff --name-only "$BEFORE" "$SHA" 2>/dev/null || true)
          fi
          build=true
          if [ -n "$files" ] && ! printf '%s\n' "$files" | grep -qvE '^docs/|\.md$'; then
            build=false
          fi
          printf '%s\n' "$files" | sed 's/^/changed: /'
          echo "build=$build" | tee -a "$GITHUB_OUTPUT"

  test:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to a commit, not a tag: a tag can be moved to other
      # code, a commit can't. Dependabot keeps the pins current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          # The Go version in go.mod, so CI and local builds match.
          go-version-file: go.mod
          # The caches below replace setup-go's own.
          cache: false
      # Compiled packages and downloaded modules. The key changes with
      # go.sum; a run whose go.sum is new (a dependency update) starts from
      # the newest cache instead and compiles only the modules that changed.
      - id: go-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-test-${{ hashFiles('go.sum') }}
          restore-keys: go-test-
      # buf and protoc-gen-go, which make installs into bin/ from source. Only
      # an exact match: the key is the Makefile, which pins their versions, and
      # make would keep an older copy it found in bin/.
      - id: tools-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            bin/buf
            bin/protoc-gen-go
          key: tools-${{ hashFiles('Makefile') }}
      - run: make lint
      # The public repo must never depend on the private one. Fails on any
      # reference to the private module path (setdrift.io/setdrift).
      - name: No references to the private module
        run: |
          if git grep -n 'setdrift\.io/setdrift\([/"]\|$\)'; then
            echo "error: the public repo references the private module" >&2
            exit 1
          fi
      # Generated code and THIRD_PARTY_NOTICES are committed. Regenerate both
      # and fail if anything changed or a new file appeared (git status sees
      # new files; git diff would not).
      - name: Generated files are up to date
        run: |
          make generate notices
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            git diff
            echo "error: run make generate notices and commit the result" >&2
            exit 1
          fi
      # -race also catches data races in the concurrent code (collect, verify).
      - name: Test
        # -shuffle=on runs the tests in a random order, so one that only
        # passes by luck of the order fails here instead of in a later PR.
        run: go test -race -shuffle=on ./...
      - if: env.SAVE_CACHE == 'true' && steps.go-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ steps.go-cache.outputs.cache-primary-key }}
      - if: env.SAVE_CACHE == 'true' && steps.tools-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            bin/buf
            bin/protoc-gen-go
          key: ${{ steps.tools-cache.outputs.cache-primary-key }}

  # The release archives for every platform, built as a release builds them
  # but published nowhere. This is the one place CI compiles for each OS and
  # CPU, so an OS-specific build break shows up here rather than at release
  # time; make size then checks those binaries against the size budget. The
  # archives go to the install jobs below.
  release-build:
    needs: changes
    # Skipped only when the changes job says docs only: if that job failed,
    # this still runs, so a broken check can't skip the build.
    if: ${{ !cancelled() && needs.changes.outputs.build != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      # Its own cache, holding all six platforms; see the test job.
      - id: go-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-release-${{ hashFiles('go.sum') }}
          restore-keys: go-release-
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: "~> v2"
          args: release --snapshot --clean
      # The release binaries stay under the size budget (Makefile MAX_SIZE_MIB).
      - name: Binary size
        run: make size
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
          retention-days: 3
      - if: env.SAVE_CACHE == 'true' && steps.go-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ steps.go-cache.outputs.cache-primary-key }}

  # The install commands in README.md, on each OS and CPU a release supports:
  # each installer fetches those archives from a local server (as from a
  # release), checks the checksum, installs, and runs setdrift.
  # macOS and Windows run on pull requests (and runs started by hand or by
  # dependabot-notices.yaml) and release tags only. GitHub's
  # macOS runners can sit in a queue for minutes, and a push to main has
  # already passed them in its pull request, so a push runs the Linux ones.
  install-unix:
    needs: release-build
    if: ${{ !cancelled() && needs.release-build.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')) && '["ubuntu-latest", "ubuntu-24.04-arm", "macos-latest", "macos-15-intel"]' || '["ubuntu-latest", "ubuntu-24.04-arm"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: install.sh
        run: |
          (cd dist && python3 -m http.server 8765 >/dev/null 2>&1 &)
          # Wait for the server: a slow runner takes more than a few seconds.
          for i in $(seq 60); do curl -fsI http://127.0.0.1:8765/checksums.txt >/dev/null 2>&1 && break; sleep 1; done
          version=$(ls dist/*_linux_amd64.tar.gz | sed 's#.*/setdrift_##; s#_linux_amd64.tar.gz##')
          SETDRIFT_VERSION=$version SETDRIFT_DOWNLOAD_URL=http://127.0.0.1:8765 sh scripts/install.sh
          bin=$(command -v setdrift || echo "$HOME/.local/bin/setdrift")
          "$bin" version | grep -F "v$version"
          "$bin" export --help >/dev/null

  install-windows:
    needs: release-build
    # Pull requests, started runs and release tags only, as the note above
    # install-unix says.
    if: ${{ !cancelled() && needs.release-build.result == 'success' && (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')) }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm]
        # PowerShell 7, and the Windows PowerShell 5.1 that every Windows has.
        shell: [pwsh, powershell]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: install.ps1
        run: |
          Start-Process python -ArgumentList '-m', 'http.server', '8765' -WorkingDirectory dist -WindowStyle Hidden
          # Wait for the server: a slow runner takes more than a few seconds.
          foreach ($i in 1..60) {
            try { Invoke-WebRequest -UseBasicParsing -Method Head http://127.0.0.1:8765/checksums.txt | Out-Null; break } catch { Start-Sleep -Seconds 1 }
          }
          $version = (Get-ChildItem dist/*_windows_amd64.zip).Name -replace '^setdrift_(.*)_windows_amd64\.zip$', '$1'
          $env:SETDRIFT_VERSION = $version
          $env:SETDRIFT_DOWNLOAD_URL = 'http://127.0.0.1:8765'
          Get-Content -Raw scripts/install.ps1 | Invoke-Expression
          $exe = Join-Path $env:LOCALAPPDATA 'Programs\setdrift\setdrift.exe'
          $out = & $exe version
          $out
          if ($out -notlike "*v$version*") { throw "setdrift version printed $out" }
          # On the PATH of this session, and of new terminals.
          (Get-Command setdrift).Source
          if (-not ([Environment]::GetEnvironmentVariable('Path', 'User') -split ';' -contains (Split-Path $exe))) { throw 'not on the user PATH' }

  # Not here yet: end-to-end export, restore and verify against EKS for the
  # three Kubernetes versions EKS supports (n-2). The harness is in test/e2e;
  # running it from CI needs AWS credentials through OIDC (no stored keys) and
  # a way to keep forked pull requests from starting billed clusters.

