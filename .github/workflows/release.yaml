# Release on a version tag: git tag v0.1.0 && git push origin v0.1.0.
# GoReleaser (.goreleaser.yaml) builds every platform, publishes the GitHub
# release with checksums.txt, and updates the formula in
# setdrift/homebrew-tap; then GitHub attests where each archive was built.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# One release at a time; never cancel one halfway through publishing.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      # the release and its archives
      contents: write
      # the build provenance attestations
      id-token: write
      attestations: write
    steps:
      # Actions pinned to a commit, as in ci.yaml; Dependabot keeps them current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # GoReleaser builds the changelog from the history since the last tag.
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Test
        run: go test ./...
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          # v2: the formula (brews) is deprecated in favor of casks, which
          # macOS quarantines; it is still supported throughout v2.
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # write access to setdrift/homebrew-tap only (see .goreleaser.yaml)
          HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
      # setdrift.io/docs shows each release line's newest release: rebuild it
      # with this one. Needs SITE_DISPATCH_TOKEN (see docs.yaml); skipped without it.
      - name: Publish the docs of this release
        env:
          GH_TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "SITE_DISPATCH_TOKEN is not set: setdrift.io shows this release's docs at its next deploy"
            exit 0
          fi
          gh api repos/setdrift/setdrift.io/dispatches -f event_type=engine-release
