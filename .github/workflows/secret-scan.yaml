# The secret scan, on every push to any branch or tag and every pull request:
# credentials, personal information and cloud identifiers must never reach
# this public repository (scripts/secret-scan.sh, rules in .gitleaks.toml). It
# scans the whole history each time, which takes seconds, so nothing a push
# brings in, a rebased commit included, goes unseen. It is a required check,
# so a pull request with a finding can't merge, and release.yaml runs it
# before publishing. The pre-commit and pre-push hooks (make hooks) run the
# same scan before a commit or a push leaves your machine.

name: secret-scan

on:
  push:
    branches: ["**"]
    tags: ["**"]
  pull_request:
  workflow_call:

# Read-only token: the scan only reads the repository.
permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    env:
      # gitleaks, pinned with the checksum its release publishes
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      # Actions are pinned to a commit, as in ci.yaml.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # the whole history, every commit is scanned
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          archive=gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz
          curl -fsSLo "$RUNNER_TEMP/$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
          echo "GITLEAKS=$RUNNER_TEMP/gitleaks" >>"$GITHUB_ENV"
      - name: Scan
        env:
          # names and addresses to refuse, one a line, kept as a secret since
          # listing them in the repository would publish them. Pull requests
          # from forks don't get secrets; their commits are scanned again on
          # the push that merges them.
          PII_DENYLIST: ${{ secrets.PII_DENYLIST }}
          # event values reach the script through the environment, never pasted into it
          EVENT: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
        run: |
          # a fork's pull request has no secrets, so it is scanned without the denylist
          if [ "$EVENT" = pull_request ] && [ "$HEAD_REPO" != "$REPO" ]; then
            export CI=false
          fi
          scripts/secret-scan.sh all

