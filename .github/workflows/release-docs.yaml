# A release branch (release-v0.2) holds a released version's docs fixes, so
# setdrift.io can show them before the next release. It may differ from the
# newest tag it holds only in docs/, README.md and .github/workflows/ (a
# release older than these workflows gets main's copies): code goes to main
# and out in a release, never onto a release branch. See docs/releasing.md.
name: release-docs

on:
  push:
    branches: ["release-v*"]
  pull_request:
    branches: ["release-v*"]

permissions:
  contents: read

jobs:
  docs-only:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to a commit, as in ci.yaml.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # the tags too, to find the release the branch starts from
          fetch-depth: 0
          persist-credentials: false
      - name: Only docs changed since the release
        run: |
          # the newest release tag the branch holds
          tag=$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' HEAD)
          other=$(git diff --name-only "$tag" HEAD -- . ':!docs/' ':!README.md' ':!.github/workflows/')
          if [ -n "$other" ]; then
            echo "::error::a release branch may change only docs/, README.md and .github/workflows/ since $tag, but these changed:"
            echo "$other"
            exit 1
          fi
          echo "only docs/, README.md and .github/workflows/ changed since $tag"

