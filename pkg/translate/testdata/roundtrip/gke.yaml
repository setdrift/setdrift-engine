# A representative GKE cluster as its export holds it, for TestRoundTripAllDirections: a storage class of its general SSD and a tuned one,
# an internal load balancer, a public Ingress, a workload pinned to a node pool and one on spot, a workload using the cloud's identity, a NetworkPolicy and a ConfigMap
# every platform in the capability map needs one, named for its distribution
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: fast
parameters:
  type: pd-balanced
provisioner: pd.csi.storage.gke.io
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: tuned
parameters:
  type: pd-ssd
provisioner: pd.csi.storage.gke.io
---
apiVersion: v1
kind: Service
metadata:
  annotations:
    networking.gke.io/load-balancer-type: Internal
  name: web-lb
  namespace: shop
spec:
  ports:
  - port: 80
  type: LoadBalancer
---
apiVersion: v1
kind: ServiceAccount
metadata:
  annotations:
    iam.gke.io/gcp-service-account: orders@iam.gserviceaccount.com
  name: orders
  namespace: shop
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders
  namespace: shop
spec:
  selector:
    matchLabels:
      app: orders
  template:
    metadata:
      labels:
        app: orders
    spec:
      containers:
      - image: busybox
        name: orders
        ports:
        - containerPort: 8080
      nodeSelector:
        cloud.google.com/gke-nodepool: batch
      serviceAccountName: orders
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: batch
  namespace: shop
spec:
  selector:
    matchLabels:
      app: batch
  template:
    metadata:
      labels:
        app: batch
    spec:
      containers:
      - image: busybox
        name: batch
      nodeSelector:
        cloud.google.com/gke-spot: "true"
      tolerations:
      - effect: NoSchedule
        key: cloud.google.com/gke-spot
        operator: Equal
        value: "true"
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-all
  namespace: shop
spec:
  podSelector: {}
---
apiVersion: v1
data:
  mode: prod
kind: ConfigMap
metadata:
  name: settings
  namespace: shop
