# What belongs to AKS: names and markers that only AKS, or Azure's own
# controllers on it, act on. Karpenter's own names are shared with EKS: AKS
# Node Auto Provisioning runs Karpenter.
distribution: aks
name: AKS
# its code in a translation's name, like te2g for EKS to GKE
code: a
cloud: azure
aliases: [azure]
markers:
  finalizerPrefixes:
    - kubernetes.azure.com/
  serviceAnnotationPrefixes:
    - service.beta.kubernetes.io/azure-
  ingressControllers:
    - azure/application-gateway
    - webapprouting.kubernetes.azure.com/nginx
  ingressAnnotationPrefixes:
    - appgw.ingress.kubernetes.io/
  ingressClassAnnotations:
    - azure/application-gateway
    - webapprouting.kubernetes.azure.com
    # Application Gateway for Containers' class, the one a translation to AKS writes
  gatewayControllerPrefixes:
    - alb.networking.azure.io/
  storageProvisioners:
    - disk.csi.azure.com
    - file.csi.azure.com
    - blob.csi.azure.com
    - kubernetes.io/azure-disk
    - kubernetes.io/azure-file
  serviceAccountAnnotations:
    - azure.workload.identity/client-id
  podLabels:
    - azure.workload.identity/use
  nodeLabelPrefixes:
    - kubernetes.azure.com/
    - karpenter.azure.com/
    - karpenter.sh/
  secretStoreProviders:
    - azurekv
  secretProviderClassProviders:
    - azure
  apiGroupSuffixes:
    - karpenter.sh
    - karpenter.azure.com
    - approuting.kubernetes.azure.com
    - alb.networking.azure.io
    - azure.com
cloudResources:
  - name: Azure Service Operator
    groupSuffixes: [azure.com]
    # AKS's own groups under azure.com, which aren't cloud resources
    exceptSuffixes: [karpenter.azure.com, kubernetes.azure.com]
    retain: {annotation: serviceoperator.azure.com/reconcile-policy, value: detach-on-delete}
    adoptNote: "Azure Service Operator takes over an existing resource of the same name and resource group by itself"
  - name: Crossplane's Azure provider
    groupSuffixes: [azure.upbound.io, azure.m.upbound.io, azure.crossplane.io]
    retain: {field: spec.deletionPolicy, value: Orphan}
    adoptNote: "the exported object keeps its crossplane.io/external-name annotation, so Crossplane takes over the existing resource instead of creating one"
translate:
  dir: platform/azure/aks
  storage:
    # the limits are Azure's, from its disk types docs (2026): Premium SSD v2 is gp3's model (3000 IOPS and 125 MB/s free, up to 80,000 and 2,000), Ultra Disk goes to 400,000
    - tier: hdd
      provisioners: [disk.csi.azure.com, kubernetes.io/azure-disk]
      parameter: skuName
      values: [Standard_LRS]
      class: {provisioner: disk.csi.azure.com, parameters: {skuName: Standard_LRS}}
    - tier: general-ssd
      provisioners: [disk.csi.azure.com, kubernetes.io/azure-disk]
      parameter: skuName
      # Premium SSD (v1) sets its performance by size, so it reads as general SSD, gp3 on EKS
      values: [StandardSSD_LRS, StandardSSD_ZRS, PremiumV2_LRS, Premium_LRS, Premium_ZRS]
      default: true
      class: {provisioner: disk.csi.azure.com, parameters: {skuName: PremiumV2_LRS, cachingMode: None, DiskIOPSReadWrite: "3000", DiskMBpsReadWrite: "125"}}
      performance: {iops: DiskIOPSReadWrite, throughput: DiskMBpsReadWrite, maxIOPS: 80000, maxThroughput: 2000, baseIOPS: 3000, baseThroughput: 125}
      zoneRedundant: [StandardSSD_ZRS, Premium_ZRS]
      shape: [cachingMode]
    - tier: premium-ssd
      provisioners: [disk.csi.azure.com]
      parameter: skuName
      # nothing on AKS reads as premium, another platform's provisioned-IOPS disks are written as Premium SSD v2, or Ultra Disk above its maximum
      values: []
      class: {provisioner: disk.csi.azure.com, parameters: {skuName: PremiumV2_LRS, cachingMode: None, DiskIOPSReadWrite: "3000", DiskMBpsReadWrite: "125"}}
      performance: {iops: DiskIOPSReadWrite, throughput: DiskMBpsReadWrite, maxIOPS: 80000, maxThroughput: 2000, baseIOPS: 3000, baseThroughput: 125}
      promoteAbove: 80000
      promote: extreme
    - tier: extreme
      provisioners: [disk.csi.azure.com]
      parameter: skuName
      values: [UltraSSD_LRS]
      class: {provisioner: disk.csi.azure.com, parameters: {skuName: UltraSSD_LRS, cachingMode: None}}
      shape: [cachingMode]
      performance: {iops: DiskIOPSReadWrite, throughput: DiskMBpsReadWrite, maxIOPS: 400000, maxThroughput: 10000}
    - tier: shared-file
      provisioners: [file.csi.azure.com, kubernetes.io/azure-file]
      default: true
      class: {provisioner: file.csi.azure.com, parameters: {skuName: Premium_LRS, protocol: nfs}}
  loadBalancer:
    annotation: service.beta.kubernetes.io/azure-load-balancer-internal
    internalValues: ["true"]
    externalValues: ["false"]
    default: external
    internal: {service.beta.kubernetes.io/azure-load-balancer-internal: "true"}
    external: {}
  ingress:
    # Application Gateway for Containers; App Routing's managed NGINX is out of Azure support from November 2026
    className: azure-alb-external
    exposureAnnotation: appgw.ingress.kubernetes.io/use-private-ip
    internalValues: ["true"]
    externalValues: ["false"]
    default: external
    internalUnsupported: true
    external: {}
  snapshotDriver: disk.csi.azure.com
  nodes:
    pools: [kubernetes.azure.com/agentpool, agentpool, karpenter.sh/nodepool]
    spot: [{key: kubernetes.azure.com/scalesetpriority, value: spot, taint: true}, {key: karpenter.sh/capacity-type, value: spot}]
  diskName: an Azure managed disk
  oidcIssuerCommand: "ISSUER=$(az aks show --name <new cluster> --resource-group <resource group> --query oidcIssuerProfile.issuerUrl -o tsv)   # needs --enable-oidc-issuer on the cluster"
  # acr-import: az acr import pulls each image from the source with a password, after the setup lines
  images:
    strategy: acr-import
    setup:
      - 'ACR=<your registry name>   # az acr create, or one you have; the cluster pulls from it once attached: az aks update --attach-acr "$ACR"'
  createCommand: az-aks-create
  networkPolicy:
    howToEnforce: "choose a network policy engine for the cluster (az aks create --network-policy cilium, calico or azure; an existing cluster can switch to one with az aks update --network-policy)"

