# What belongs to Amazon EKS: names and markers that only EKS, or AWS's own
# controllers on it, act on. An object naming one of them works on EKS and
# nowhere else (see docs/capability-map-draft.md, M0 of v0.3.0).
distribution: eks
name: EKS
# its code in a translation's name, like te2g for EKS to GKE
code: e
cloud: AWS
markers:
  finalizerPrefixes:
    - service.eks.amazonaws.com/
    - service.k8s.aws/
    - elbv2.k8s.aws/
    - ingress.k8s.aws/
    - eks.amazonaws.com/
  loadBalancerClasses:
    - service.k8s.aws/nlb
    - eks.amazonaws.com/nlb
  serviceAnnotationPrefixes:
    - service.beta.kubernetes.io/aws-load-balancer-
  ingressControllers:
    - ingress.k8s.aws/alb
    - eks.amazonaws.com/alb
  ingressAnnotationPrefixes:
    - alb.ingress.kubernetes.io/
  ingressClassAnnotations:
    - alb
  gatewayControllerPrefixes:
    - gateway.k8s.aws/
    - application-networking.k8s.aws/
  storageProvisioners:
    - ebs.csi.aws.com
    - ebs.csi.eks.amazonaws.com
    - efs.csi.aws.com
    - s3.csi.aws.com
    - fsx.csi.aws.com
    - kubernetes.io/aws-ebs
  serviceAccountAnnotations:
    - eks.amazonaws.com/role-arn
  nodeLabelPrefixes:
    - eks.amazonaws.com/
    - karpenter.k8s.aws/
    - karpenter.sh/
  secretStoreProviders:
    - aws
  secretProviderClassProviders:
    - aws
  apiGroupSuffixes:
    - karpenter.sh
    - karpenter.k8s.aws
    - eks.amazonaws.com
    - elbv2.k8s.aws
    - services.k8s.aws
cloudResources:
  - name: AWS Controllers for Kubernetes (ACK)
    groupSuffixes: [services.k8s.aws]
    retain: {annotation: services.k8s.aws/deletion-policy, value: retain}
    adopt: {annotation: services.k8s.aws/adoption-policy, value: adopt}
    adoptNote: "with the annotation, ACK takes over the existing resource of the same name instead of creating one (some kinds also need services.k8s.aws/adoption-fields naming it)"
  - name: Crossplane's AWS provider
    groupSuffixes: [aws.upbound.io, aws.m.upbound.io, aws.crossplane.io]
    retain: {field: spec.deletionPolicy, value: Orphan}
    adoptNote: "the exported object keeps its crossplane.io/external-name annotation, so Crossplane takes over the existing resource instead of creating one"
translate:
  # where a translation for EKS goes in an export
  dir: platform/aws/eks
  storage:
    # tiers, matched on the source by provisioner and a parameter, written on the target as its class
    # the limits are AWS's, from its EBS docs (2026): gp3 and io2 take IOPS and throughput, st1 starts at 125 GiB
    - tier: hdd
      provisioners: [ebs.csi.aws.com, ebs.csi.eks.amazonaws.com, kubernetes.io/aws-ebs]
      parameter: type
      values: [st1, sc1, standard]
      class: {provisioner: ebs.csi.eks.amazonaws.com, parameters: {type: st1}}
      minSizeGi: 125
      fallback: general-ssd
    - tier: general-ssd
      provisioners: [ebs.csi.aws.com, ebs.csi.eks.amazonaws.com, kubernetes.io/aws-ebs]
      parameter: type
      values: [gp3, gp2]
      default: true
      class: {provisioner: ebs.csi.eks.amazonaws.com, parameters: {type: gp3}}
      performance: {iops: iops, throughput: throughput, iopsPerGi: iopsPerGB, maxIOPS: 80000, maxThroughput: 2000, baseIOPS: 3000, baseThroughput: 125}
    - tier: premium-ssd
      provisioners: [ebs.csi.aws.com, ebs.csi.eks.amazonaws.com]
      parameter: type
      values: [io1, io2]
      # io2 needs its IOPS set, 3000 like the other clouds' baseline unless the source's carry over
      class: {provisioner: ebs.csi.eks.amazonaws.com, parameters: {type: io2, iops: "3000"}}
      performance: {iops: iops, iopsPerGi: iopsPerGB, maxIOPS: 256000}
    - tier: extreme
      provisioners: [ebs.csi.aws.com, ebs.csi.eks.amazonaws.com]
      parameter: type
      # nothing on EKS reads as extreme, io2 Block Express is written for another platform's extreme disks
      values: []
      class: {provisioner: ebs.csi.eks.amazonaws.com, parameters: {type: io2, iops: "3000"}}
      performance: {iops: iops, iopsPerGi: iopsPerGB, maxIOPS: 256000}
    - tier: shared-file
      provisioners: [efs.csi.aws.com]
      default: true
      class: {provisioner: efs.csi.aws.com, parameters: {provisioningMode: efs-ap, fileSystemId: "<EFS file system ID>", directoryPerms: "700"}}
  loadBalancer:
    # how a Service's exposure reads on this platform, and how its written
    annotation: service.beta.kubernetes.io/aws-load-balancer-scheme
    internalValues: [internal]
    externalValues: [internet-facing]
    # with no annotation: the Load Balancer Controller and Auto Mode classes default to internal, the legacy cloud provider to internet-facing
    classDefaults: {service.k8s.aws/nlb: internal, eks.amazonaws.com/nlb: internal}
    default: external
    internal: {service.beta.kubernetes.io/aws-load-balancer-scheme: internal}
    external: {service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing}
    class: eks.amazonaws.com/nlb
  ingress:
    # the AWS Load Balancer Controller's class; Auto Mode clusters name theirs in an IngressClass with controller eks.amazonaws.com/alb
    className: alb
    exposureAnnotation: alb.ingress.kubernetes.io/scheme
    internalValues: [internal]
    externalValues: [internet-facing]
    default: internal
    internal: {alb.ingress.kubernetes.io/scheme: internal}
    external: {alb.ingress.kubernetes.io/scheme: internet-facing}
  snapshotDriver: ebs.csi.eks.amazonaws.com
  nodes:
    pools: [eks.amazonaws.com/nodegroup, karpenter.sh/nodepool]
    spot: [{key: eks.amazonaws.com/capacityType, value: SPOT}, {key: karpenter.sh/capacity-type, value: spot}]

