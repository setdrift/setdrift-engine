# EKS Auto Mode creates no StorageClass, so the EKS e2e cluster gets this
# one as its default. Applied on EKS only (populate.sh): on AKS and GKE its
# provisioner doesn't exist, and as a second default class it would take the
# fixtures' claims, which would then wait forever.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gp3
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: ebs.csi.eks.amazonaws.com
parameters:
  type: gp3
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true

