# EKS's own objects, applied on EKS only (populate.sh); 20-apps-aks.yaml and
# 20-apps-gke.yaml hold each cloud's equivalents.
---
# IRSA: the playbook must say the role's trust policy needs the new
# cluster's OIDC provider. The role need not exist.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: reports
  namespace: sd-apps
  annotations: {eks.amazonaws.com/role-arn: "arn:aws:iam::111122223333:role/setdrift-e2e-reports"}
---
# A workload using that identity, so a translation for another cloud gives
# its Pods the token and settings this cloud's webhook would (keep-source).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reports
  namespace: sd-apps
spec:
  replicas: 1
  selector: {matchLabels: {app: reports}}
  template:
    metadata: {labels: {app: reports}}
    spec:
      serviceAccountName: reports
      containers:
      - name: reports
        image: public.ecr.aws/docker/library/busybox:1.36
        command: [sleep, infinity]
        resources: {requests: {cpu: 10m, memory: 16Mi}}
---
# Values bound to one region or account, which break a rebuild elsewhere:
# export and diff flag them (region-portability findings). Fake, in each
# value's real format; nothing reads them.
apiVersion: v1
kind: ConfigMap
metadata:
  name: shop-config
  namespace: sd-apps
data:
  CERTIFICATE_ARN: arn:aws:acm:us-east-2:111122223333:certificate/0f2c9a4e-7b1d-4c3a-9e8f-1a2b3c4d5e6f
  KMS_KEY_ARN: arn:aws:kms:us-east-2:111122223333:key/6a1b2c3d-4e5f-4a6b-8c7d-9e0f1a2b3c4d
  QUEUE_ARN: arn:aws:sqs:us-east-2:111122223333:shop-orders
  SUBNETS: subnet-0a1b2c3d4e5f6a7b8,subnet-0b2c3d4e5f6a7b8c9
  SECURITY_GROUP: sg-0c3d4e5f6a7b8c9d0
---
# An image in this cloud's own registry. Scaled to 0, so nothing pulls it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop-worker
  namespace: sd-apps
spec:
  replicas: 0
  selector: {matchLabels: {app: shop-worker}}
  template:
    metadata: {labels: {app: shop-worker}}
    spec:
      containers:
      - name: worker
        image: 111122223333.dkr.ecr.us-east-2.amazonaws.com/acme/shop:1.4
        resources: {requests: {cpu: 10m, memory: 16Mi}}
---
# An internal NLB (EKS Auto Mode), whose address changes in a new cluster.
apiVersion: v1
kind: Service
metadata:
  name: web-lb
  namespace: sd-apps
  annotations: {service.beta.kubernetes.io/aws-load-balancer-scheme: internal}
spec:
  type: LoadBalancer
  loadBalancerClass: eks.amazonaws.com/nlb
  selector: {app: web}
  ports: [{port: 80, targetPort: 80}]

