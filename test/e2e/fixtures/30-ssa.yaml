# Namespace sd-ssa: applied with kubectl apply --server-side.
apiVersion: apps/v1
kind: Deployment
metadata: {name: cache, namespace: sd-ssa, labels: {app.kubernetes.io/name: cache}}
spec:
  replicas: 1
  selector: {matchLabels: {app: cache}}
  template:
    metadata: {labels: {app: cache}}
    spec:
      containers:
      - name: cache
        image: public.ecr.aws/docker/library/redis:7
        ports: [{containerPort: 6379}]
        resources: {requests: {cpu: 20m, memory: 32Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: cache, namespace: sd-ssa}
spec:
  selector: {app: cache}
  ports: [{port: 6379}]
---
apiVersion: v1
kind: ConfigMap
metadata: {name: settings, namespace: sd-ssa}
data: {mode: fast}
