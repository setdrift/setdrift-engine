# A real Flux Kustomization (Flux installed by populate.sh).
apiVersion: v1
kind: Namespace
metadata: {name: sd-flux}
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata: {name: podinfo, namespace: flux-system}
spec:
  interval: 10m
  url: https://github.com/stefanprodan/podinfo
  ref: {branch: master}
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata: {name: podinfo, namespace: flux-system}
spec:
  interval: 10m
  path: ./kustomize
  prune: true
  sourceRef: {kind: GitRepository, name: podinfo}
  targetNamespace: sd-flux

