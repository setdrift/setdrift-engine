# The store the export's ExternalSecrets reference by default. External
# Secrets Operator authenticates with EKS Pod Identity (eks-cluster.yaml).
# REGION is replaced by populate.sh.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata: {name: aws-secrets-manager}
spec:
  provider:
    aws:
      service: SecretsManager
      region: REGION
