# Helm 4 post-renderer plugin - adds setdrift.io/source-repo=<url> to every release object, install with:
#   helm plugin install contrib/helm/setdrift-source-repo
#   helm install web oci://registry.example.com/charts/web \
#     --post-renderer setdrift-source-repo \
#     --post-renderer-args --source-repo=oci://registry.example.com/charts
apiVersion: v1
type: postrenderer/v1
name: setdrift-source-repo
version: 0.1.0
sourceURL: https://github.com/setdrift/setdrift-engine
runtime: subprocess
runtimeConfig:
  platformCommand:
    - os: windows
      command: ${HELM_PLUGIN_DIR}\postrender.cmd
    # through sh, so the script runs even when a copy lost its executable bit
    - command: sh
      args: ["${HELM_PLUGIN_DIR}/postrender.sh"]
