# A Google Cloud custom role that adds Secrets to roles/container.viewer, for
# granting setdrift export's Kubernetes access with IAM (docs/permissions-gcp.md).
# SetDrift keeps only the Secrets' key names, dropping each value as soon as it
# reads it. Grant it together with roles/container.viewer.
#
#   gcloud iam roles create setdrift_secrets_reader --project=PROJECT --file=setdrift-secrets-reader-role.yaml
#   gcloud projects add-iam-policy-binding PROJECT --member=user:EMAIL --role=roles/container.viewer
#   gcloud projects add-iam-policy-binding PROJECT --member=user:EMAIL --role=projects/PROJECT/roles/setdrift_secrets_reader
title: SetDrift secrets reader
description: List Kubernetes Secrets in GKE clusters, with roles/container.viewer, for setdrift export
stage: GA
includedPermissions:
- container.secrets.list

