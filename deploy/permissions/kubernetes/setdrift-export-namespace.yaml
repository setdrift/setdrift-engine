# setdrift-export.yaml for one namespace: a Role and RoleBinding, for
# setdrift export -n <namespace>. Cluster-scoped types are then not read.
#
#   kubectl apply -n <namespace> -f setdrift-export-namespace.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: setdrift-export
  labels:
    app.kubernetes.io/name: setdrift
rules:
- apiGroups: ["*"]
  resources: ["*"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: setdrift-export
  labels:
    app.kubernetes.io/name: setdrift
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: setdrift-export
subjects:
- apiGroup: rbac.authorization.k8s.io
  kind: Group
  name: setdrift-export

